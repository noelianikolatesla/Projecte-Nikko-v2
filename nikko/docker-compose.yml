services:
  # 1. Servidor Node.js
  node_backend:
    build:
      context: ./backend/node_app
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - AI_SERVICE_URL=http://ai_service:8000
    restart: unless-stopped
    depends_on:
      - ai_service

  # 2. Servicio de IA (Python/FastAPI)
  ai_service:
    build:
      context: ./backend/ai_service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/ai_service/.env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: unless-stopped
    depends_on:
      - ollama

  # 3. Servidor de Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
      - ./ai_config:/ai_config
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*

  # 4. Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - node_backend
    restart: unless-stopped

  # 5. Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana_data:/var/lib/grafana
    environment:
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
    restart: unless-stopped
    depends_on:
      - ai_service